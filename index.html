<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background-color: #f7f4ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .container { display: flex; flex-direction: row; background-color: #ffffff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); overflow: hidden; max-width: 820px; width: 100%; min-height: 480px; }
    .form-section { flex: 1; padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center; gap: 1rem; }
    .title { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; line-height: 1.3; }
    .subtitle { font-size: 0.82rem; color: #888; line-height: 1.5; }
    .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .form-group label { font-size: 0.72rem; color: #aaa; }
    .form-group input { border: none; border-bottom: 1.5px solid #ddd; outline: none; padding: 0.4rem 0; font-size: 0.9rem; color: #333; background: transparent; transition: border-color 0.25s; }
    .form-group input:focus { border-bottom-color: #4a90d9; }
    .form-group input::placeholder { color: #bbb; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .checkbox-group label { font-size: 0.78rem; color: #888; }
    .checkbox-group label a { color: #4a90d9; text-decoration: none; }
    .btn-signup { margin-top: 0.75rem; padding: 0.65rem 2rem; background-color: #4a90d9; color: #fff; border: none; border-radius: 50px; font-size: 0.88rem; cursor: pointer; align-self: flex-start; box-shadow: 0 4px 14px rgba(74,144,217,0.35); }
    .btn-signup:hover { background-color: #2f78c5; }
    .illustration-section { flex: 1; background-color: #fdf8f2; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .illustration-svg { width: 100%; max-width: 380px; height: auto; }
    @media (max-width: 640px) { .container { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h1 class="title">Ready to start your<br/>success story?</h1>
      <p class="subtitle">Signup to our website and start leafing through your favorite literature today!</p>
      <div class="form-group">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="janedoe@mail.com" />
      </div>
      <div class="form-group">
        <label for="interest">Area of interest</label>
        <input type="text" id="interest" placeholder="e.g. Fiction, Science..." />
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
      </div>
      <button class="btn-signup">Sign up</button>
    </div>
    <div class="illustration-section">
      <svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
        <rect x="100" y="290" width="200" height="80" rx="4" fill="#f5f0e8" stroke="#d4c9b0" stroke-width="1.5"/>
        <line x1="200" y1="290" x2="200" y2="370" stroke="#d4c9b0" stroke-width="1.5"/>
        <path d="M100 295 Q150 285 200 292" stroke="#c8bfa8" stroke-width="1" fill="none"/>
        <path d="M100 305 Q150 295 200 302" stroke="#c8bfa8" stroke-width="1" fill="none"/>
        <path d="M200 292 Q250 285 300 295" stroke="#c8bfa8" stroke-width="1" fill="none"/>
        <path d="M200 302 Q250 295 300 305" stroke="#c8bfa8" stroke-width="1" fill="none"/>
        <rect x="140" y="250" width="120" height="35" rx="8" fill="#e8453c"/>
        <rect x="140" y="255" width="120" height="5" fill="white" opacity="0.7"/>
        <rect x="140" y="265" width="120" height="5" fill="white" opacity="0.7"/>
        <rect x="140" y="275" width="120" height="5" fill="white" opacity="0.7"/>
        <path d="M145 265 Q110 275 100 300" stroke="#f5d5b0" stroke-width="14" stroke-linecap="round" fill="none"/>
        <ellipse cx="160" cy="240" rx="32" ry="28" fill="#f5d5b0"/>
        <path d="M132 230 Q120 200 140 185 Q160 175 175 180 Q195 170 195 195 Q175 220 165 240 Q150 245 132 230Z" fill="#d4500a"/>
        <rect x="200" y="215" width="45" height="55" rx="8" fill="#2a9d8f"/>
        <ellipse cx="320" cy="295" rx="22" ry="18" fill="#d4500a" opacity="0.85"/>
        <path d="M302 282 L296 268 L310 278Z" fill="#d4500a"/>
        <path d="M338 282 L344 268 L330 278Z" fill="#d4500a"/>
        <circle cx="320" cy="290" r="10" fill="#e8a070"/>
        <path d="M342 300 Q360 285 355 270" stroke="#d4500a" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </div>
</body>
</html>
